<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#143d35"><title>חלוקת חשבון במסעדה</title><style>
:root{font-family:system-ui,-apple-system,Arial,sans-serif;color:#152622;background:#f2f7f5}*{box-sizing:border-box}body{margin:0;padding:18px 12px 48px}.app{max-width:540px;margin:auto}h1{font-size:24px;margin:8px 0 5px}p.sub{color:#52645e;margin:0 0 20px;font-size:14px}.panel{background:white;border:1px solid #dce9e3;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 3px 14px #173c2d0a}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tab{border:1px solid #c8dcd2;border-radius:12px;background:#f5faf7;color:#244b40;padding:13px 6px;font-size:15px;font-weight:700}.tab.active{background:#155845;color:white;border-color:#155845}label{display:block;font-size:14px;font-weight:650;margin-bottom:6px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}input{width:100%;border:1px solid #c8d8d0;border-radius:10px;padding:12px;font-size:17px;min-width:0;background:#fff;color:#142921}input:focus{outline:2px solid #329474;outline-offset:1px}.tips{display:flex;gap:8px;flex-wrap:wrap}.tip{padding:10px 17px;border:1px solid #cadbd3;background:#fff;border-radius:11px;font-weight:700;color:#285246}.tip.active{background:#155845;color:#fff}.result{background:#e1f2e9;text-align:center;padding:20px;border-radius:14px;margin-top:16px}.result small{display:block;color:#355d50}.big{font-size:34px;font-weight:800;color:#155845;direction:ltr}.line{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:11px 0}.line strong{direction:ltr}.person{display:grid;grid-template-columns:minmax(0,1fr) 115px 38px;gap:8px;align-items:end;margin:11px 0}.person label{font-size:12px}.delete{border:0;background:#fae9e9;color:#a72929;border-radius:10px;height:46px;font-size:20px}.btn{border:none;border-radius:12px;padding:13px 18px;font-size:15px;font-weight:700;background:#155845;color:white;cursor:pointer}.secondary{background:#e4efe9;color:#155845}.actions{display:flex;flex-wrap:wrap;gap:9px}.hidden{display:none!important}.breakdown{border-top:1px solid #e0e9e4;margin-top:15px;padding-top:10px}.breakdown .line{border-bottom:1px solid #eef1ef;padding-bottom:9px}.footer{font-size:12px;color:#697c73;text-align:center;margin-top:20px}button{cursor:pointer}button:focus-visible{outline:3px solid #59ae8e} @media(max-width:360px){.person{grid-template-columns:minmax(0,1fr) 92px 34px}.panel{padding:13px} .big{font-size:30px}}
</style></head><body><main class="app"><h1>🍽️ חלוקת חשבון במסעדה</h1><p class="sub">מחשבים בקלות כמה כל אחד צריך לשלם</p><section class="panel"><div class="tabs"><button type="button" class="tab active" id="equalTab">חלוקה שווה</button><button type="button" class="tab" id="personalTab">לפי הזמנה</button></div></section><section class="panel" id="equalView"><div class="fields"><div><label for="total">סכום החשבון (₪)</label><input type="number" id="total" inputmode="decimal" min="0" step="0.01"></div><div><label for="count">מספר סועדים</label><input type="number" id="count" inputmode="numeric" min="1" step="1"></div></div></section><section class="panel hidden" id="personalView"><div class="line"><strong>סועדים</strong><button type="button" class="btn secondary" id="add">+ הוסף סועד</button></div><div id="people"></div></section><section class="panel"><label>טיפ</label><div class="tips" id="tips"><button type="button" class="tip" data-tip="0">0%</button><button type="button" class="tip" data-tip="10">10%</button><button type="button" class="tip" data-tip="12">12%</button><button type="button" class="tip" data-tip="15">15%</button></div><div class="line"><span>סכום החשבון</span><strong id="subtotal"></strong></div><div class="line"><span>טיפ</span><strong id="tipAmount"></strong></div><div class="line"><b>סה״כ כולל טיפ</b><strong id="grand"></strong></div><div id="equalResult" class="result"><small>כל סועד משלם</small><div class="big" id="perPerson"></div></div><div id="personalResult" class="breakdown hidden"><h3>פירוט תשלום לכל סועד</h3><div id="breakdown"></div></div></section><section class="panel actions"><button type="button" class="btn" id="share">שתף סיכום</button><button type="button" class="btn secondary" id="copy">העתק סיכום</button><button type="button" class="btn secondary" id="reset">איפוס</button></section><p class="footer">הנתונים נשמרים אוטומטית במכשיר ובדפדפן זה. המחשבון פועל גם ללא אינטרנט.</p></main><script>
(()=>{'use strict';const KEY='restaurant-split-he-v1';const defaults=()=>({mode:'equal',total:'400',count:'4',tip:10,people:[{id:1,name:'סועד 1',amount:'120'},{id:2,name:'סועד 2',amount:'80'},{id:3,name:'סועד 3',amount:'150'},{id:4,name:'סועד 4',amount:'50'}],nextId:5});let state;try{state={...defaults(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{state=defaults()}if(!Array.isArray(state.people)||!state.people.length)state.people=defaults().people;const el=id=>document.getElementById(id), num=x=>Math.max(0,Number(x)||0),fmt=x=>((Math.round((x+Number.EPSILON)*100)/100).toLocaleString('he-IL',{minimumFractionDigits:2,maximumFractionDigits:2}))+' ₪';function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}}function subtotal(){return state.mode==='equal'?num(state.total):state.people.reduce((s,p)=>s+num(p.amount),0)}function summary(){const sub=subtotal(),t=sub*state.tip/100,grand=sub+t;if(state.mode==='equal')return `חלוקת חשבון במסעדה\nחשבון: ${fmt(sub)}\nטיפ: ${state.tip}% (${fmt(t)})\nסה״כ: ${fmt(grand)}\nסועדים: ${Math.max(1,Math.floor(num(state.count)))}\nכל אחד: ${fmt(grand/Math.max(1,Math.floor(num(state.count))))}`;return `חלוקת חשבון במסעדה\nחשבון: ${fmt(sub)}\nטיפ: ${state.tip}%\n${state.people.map(p=>`${p.name||'סועד'}: ${fmt(num(p.amount)*(1+state.tip/100))}`).join('\n')}\nסה״כ: ${fmt(grand)}`}
function renderPeople(){el('people').replaceChildren();state.people.forEach(p=>{const r=document.createElement('div');r.className='person';const nameBox=document.createElement('div'),amountBox=document.createElement('div');const nl=document.createElement('label');nl.textContent='שם';const ni=document.createElement('input');ni.value=p.name;ni.placeholder='שם הסועד';ni.addEventListener('input',()=>{p.name=ni.value;renderTotals()});nameBox.append(nl,ni);const al=document.createElement('label');al.textContent='סכום (₪)';const ai=document.createElement('input');ai.type='number';ai.min='0';ai.step='0.01';ai.inputMode='decimal';ai.value=p.amount;ai.addEventListener('input',()=>{p.amount=ai.value;renderTotals()});amountBox.append(al,ai);const del=document.createElement('button');del.type='button';del.className='delete';del.textContent='×';del.title='הסר סועד';del.setAttribute('aria-label','הסר '+p.name);del.disabled=state.people.length<=1;del.addEventListener('click',()=>{state.people=state.people.filter(q=>q.id!==p.id);renderPeople();renderTotals()});r.append(nameBox,amountBox,del);el('people').append(r)})}
function renderTotals(){let sub=subtotal(),tipAmount=sub*state.tip/100,grand=sub+tipAmount;el('subtotal').textContent=fmt(sub);el('tipAmount').textContent=fmt(tipAmount);el('grand').textContent=fmt(grand);el('perPerson').textContent=fmt(grand/Math.max(1,Math.floor(num(state.count))));el('breakdown').replaceChildren();state.people.forEach(p=>{let r=document.createElement('div');r.className='line';let name=document.createElement('span');name.textContent=p.name||'סועד';let amount=document.createElement('strong');amount.textContent=fmt(num(p.amount)*(1+state.tip/100));r.append(name,amount);el('breakdown').append(r)});for(const b of el('tips').children)b.classList.toggle('active',Number(b.dataset.tip)===state.tip);save()}
function renderMode(){const eq=state.mode==='equal';el('equalView').classList.toggle('hidden',!eq);el('personalView').classList.toggle('hidden',eq);el('equalResult').classList.toggle('hidden',!eq);el('personalResult').classList.toggle('hidden',eq);el('equalTab').classList.toggle('active',eq);el('personalTab').classList.toggle('active',!eq);renderTotals()}
el('total').value=state.total;el('count').value=state.count;el('total').addEventListener('input',e=>{state.total=e.target.value;renderTotals()});el('count').addEventListener('input',e=>{state.count=e.target.value;renderTotals()});el('equalTab').addEventListener('click',()=>{state.mode='equal';renderMode()});el('personalTab').addEventListener('click',()=>{state.mode='personal';renderMode()});el('tips').addEventListener('click',e=>{const b=e.target.closest('[data-tip]');if(b){state.tip=Number(b.dataset.tip);renderTotals()}});el('add').addEventListener('click',()=>{state.people.push({id:state.nextId++,name:'סועד '+(state.people.length+1),amount:'0'});renderPeople();renderTotals()});el('reset').addEventListener('click',()=>{if(!confirm('לאפס את כל הסכומים והשמות?'))return;state=defaults();el('total').value=state.total;el('count').value=state.count;renderPeople();renderMode()});async function copy(){try{await navigator.clipboard.writeText(summary());alert('הסיכום הועתק')}catch{prompt('אפשר להעתיק את הסיכום מכאן:',summary())}}el('copy').addEventListener('click',copy);el('share').addEventListener('click',async()=>{if(navigator.share){try{await navigator.share({text:summary()})}catch(e){if(e.name!=='AbortError')copy()}}else{copy()}});renderPeople();renderMode()})();
</script></body></html>
